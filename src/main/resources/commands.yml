# ----------------------------------------------
# |              Robin v2.0.0                  |
# |          Command Config System             |
# ----------------------------------------------

# Allows for easy customization of commands and their corresponding help functions.
# Eliminates the need to recompile the bot to fix/change wording of a command's help / name.

# If 'overview' is empty, the contents of 'help' will be used instead.

# ------------------ COMMANDS ------------------
help:
  name: "help"
  usage: "/help <optional: command-name>"
  help: "Learn how to use BaseBot's commands and various features."
  overview: ""

stats:
  name: "stats"
  usage: "/stats <optional: user>, <optional: chart-type>, <optional: timezone>"
  help: "Provides statistics on server or user E posting."
  overview: "**User**: If no user is provided, the command returns server-wide statistics. If a user is provided, the command returns statistics for that user.\n\n**Chart Type**: Hourly, Daily, Monthly, or Yearly. Returns all time frequency statistics by selected timeframe.\n\n**Timezone**: accepts any timezone recognized by Java's ZoneId. Ref: \nhttps://en.wikipedia.org/wiki/List_of_tz_database_time_zones"

buildcache:
  name: "buildcache"
  usage: "/buildcache"
  help: "E"
  overview: "E"

leaderboard:
  name: "leaderboard"
  usage: "/leaderboard"
  help: "View the most active users!"
  overview: "Displays a leaderboard of the top users based on message count."

milestones:
  name: "milestones"
  usage: "/milestones"
  help: "View major 'E' milestones!"
  overview: "Displays major 'E' milestones and records."